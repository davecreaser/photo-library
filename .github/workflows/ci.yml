name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The face models are pinned by checksum; cache them so CI doesn't re-download ~39 MB each run.
      - uses: actions/cache@v4
        with:
          path: resources/models
          key: face-models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration and safety tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests (the real app, driven like a user)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
