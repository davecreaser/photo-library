name: CI

on:
  # Lean on Actions minutes: only ready (non-draft) pull requests, and only when code changed.
  # Linux runs everything. Windows and macOS (2x and 10x the cost) run by hand when a change is
  # platform-sensitive: Actions -> CI -> Run workflow, pick the branch and the OS.
  # Nothing runs on main after a merge: what lands there was tested on its PR.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      os:
        description: Which system to test on
        type: choice
        default: windows-latest
        options: [windows-latest, macos-latest, ubuntu-latest, all]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.os || 'pr' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name != 'workflow_dispatch' && '["ubuntu-latest"]' || inputs.os == 'all' && '["ubuntu-latest", "windows-latest", "macos-latest"]' || format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The models (faces 39 MB, content search 407 MB) are pinned by checksum in modelFiles.json;
      # cache them so CI doesn't download them every run. Saved straight after install (not at the
      # end of the job), so a failing test doesn't throw the download away.
      - id: models
        uses: actions/cache/restore@v4
        with:
          path: resources/models
          key: models-${{ runner.os }}-${{ hashFiles('src/main/modelFiles.json') }}

      - run: npm ci

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: resources/models
          key: models-${{ runner.os }}-${{ hashFiles('src/main/modelFiles.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration and safety tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests (the real app, driven like a user)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
