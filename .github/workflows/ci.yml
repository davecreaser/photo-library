name: CI

on:
  push:
    # Feature branches too: commits pushed by the headless agent get checked even when the
    # PR itself was opened with a token that doesn't trigger workflows.
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch: # run by hand (e.g. macOS on a PR): Actions → CI → Run workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on private repos, and the owner develops on a Mac (pre-commit
        # hooks and QA run there), so only main and manual runs use macOS; everything else runs Linux + Windows.
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["macos-latest", "windows-latest", "ubuntu-latest"]' || '["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The face models are pinned by checksum; cache them so CI doesn't re-download ~39 MB each run.
      - uses: actions/cache@v4
        with:
          path: resources/models
          key: face-models-${{ hashFiles('scripts/fetch-models.mjs') }}

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration and safety tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests (the real app, driven like a user)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
