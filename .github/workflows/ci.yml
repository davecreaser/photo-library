name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # run by hand (e.g. macOS on a PR): Actions → CI → Run workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost 10x on private repos, and the owner develops on a Mac (pre-commit
        # hooks and QA run there), so pull requests run Linux + Windows; macOS runs on main and on demand.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest", "ubuntu-latest"]' || '["macos-latest", "windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The models (faces 39 MB, content search 407 MB) are pinned by checksum in modelFiles.json;
      # cache them so CI doesn't download them every run. Saved straight after install (not at the
      # end of the job), so a failing test doesn't throw the download away.
      - id: models
        uses: actions/cache/restore@v4
        with:
          path: resources/models
          key: models-${{ runner.os }}-${{ hashFiles('src/main/modelFiles.json') }}

      - run: npm ci

      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: resources/models
          key: models-${{ runner.os }}-${{ hashFiles('src/main/modelFiles.json') }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, integration and safety tests
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests (the real app, driven like a user)
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum' || '' }} npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          retention-days: 7
